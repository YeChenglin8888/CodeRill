[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coderill"
version = "0.1.1"
description = "A small, readable AI coding agent that reads, writes, edits and runs code from your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ye Chenglin" }]
keywords = ["ai", "agent", "coding", "cli", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "openai>=1.0",
    "socksio>=1.0",
    "anthropic>=0.50",
    "rich>=13.0",
    "prompt_toolkit>=3.0.53",
    "python-dotenv>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Only needed for the optional `browser_task` tool (see README).
browser = ["playwright>=1.40", "httpx>=0.27"]
computer = ["pyautogui>=0.9.54; sys_platform == 'win32'", "httpx>=0.27"]
jev = ["httpx>=0.27"]
memory = ["sentence-transformers>=3.0"]
tui = ["textual>=0.70"]
mcp = ["mcp>=1.0,<2"]
all = ["textual>=0.70", "mcp>=1.0,<2", "playwright>=1.40", "httpx>=0.27", "pyautogui>=0.9.54; sys_platform == 'win32'"]
dev = ["pytest>=7.0", "ruff>=0.9.0"]

[project.scripts]
coderill = "coderill.cli:main"
coderill-refine = "coderill.harness2:main"

[project.urls]
Repository = "https://github.com/YeChenglin8888/CodeRill"
Issues = "https://github.com/YeChenglin8888/CodeRill/issues"

[tool.hatch.build.targets.wheel]
packages = ["coderill"]

[tool.hatch.build.targets.wheel.force-include]
"coderill/env.example" = "coderill/env.example"
"examples/benchmark_suite.py" = "examples/benchmark_suite.py"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# EXE002 fires when a .py file happens to carry the executable bit; that is a
# checkout artifact, not something to put a shebang in every module for.
ignore = ["EXE002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
