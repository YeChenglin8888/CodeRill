name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  docker-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: docker build -f sandbox/Dockerfile --target sandbox -t coderill-sandbox:local .
      - run: docker build -f sandbox/Dockerfile --target gateway -t coderill-sandbox-gateway:local .
      - run: python -m pytest tests/test_sandbox_docker.py -q
        env:
          CODERILL_DOCKER_TEST: "1"
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,tui,mcp]"
      - run: python -m pytest tests/ -q
      - run: ruff check .
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m coderill --help
